services:

  postgres:
    image: postgres:16

    container_name: irrigation_postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: irrigation_management

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    container_name: irrigation_api

    build:
      context: .
      dockerfile: IrrigationManagementSystem.API/Dockerfile

    ports:
      - "5001:8080"

    depends_on:
      - postgres

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=irrigation_management;Username=postgres;Password=postgres

volumes:
  postgres_data: